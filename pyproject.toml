[project]
name = "docai-kit"
version = "0.1.0"
description = "Pipeline determinista: Word corporativo + inventario.yaml -> plantilla DocAI y sus componentes"
authors = [
    { name = "Fastex Soluciones IT" }
]
license = "LicenseRef-Fastex"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "docxtpl==0.20.2",
    "jsonschema==4.26.0",
    "lxml==6.1.3",
    "python-docx==1.2.0",
    "ruamel-yaml==0.19.1",
]

[project.scripts]
docai-kit = "docai_kit.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ejemplos", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Las líneas largas que quedan tras `ruff format` son literales (mensajes, XML de fixtures).
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["docai_kit", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
